<body>
  <div class="wrap">
    <nav><a class="brand" href="#"><span class="mini" aria-hidden="true"></span><span class="brand-copy"><span>Mochimono</span><span class="jp">もちもの</span><span class="stuff">your stuff</span></span></a><a class="github" href="https://github.com/farzher/mochimono">GitHub ↗</a></nav>
    <main>
      <section class="hero"><div class="hero-copy"><h1>Squish your stuff.</h1><p class="lead">Don’t compare folders. Squish them together.</p><div class="actions"><a class="button" href="https://github.com/farzher/mochimono">View on GitHub</a></div></div><div class="mascot" aria-label="Smiling mochi mascot"><div class="sun"></div><div class="character"><span class="hair-flower" aria-hidden="true">✿</span><div class="mochi"><span class="mouth"></span></div></div></div></section>

        <section class="visual squish-stage" aria-label="Folders squish together into one Mochimono library"><div class="folder a" aria-hidden="true"></div><div class="folder b" aria-hidden="true"></div><div class="folder c" aria-hidden="true"></div><div class="folder d" aria-hidden="true"></div><div class="squish-core" aria-hidden="true"><div class="squish-mochi"><span class="squish-smile"></span></div></div><i class="spark s1" aria-hidden="true"></i><i class="spark s2" aria-hidden="true"></i><i class="spark s3" aria-hidden="true"></i><i class="spark s4" aria-hidden="true"></i></section>
        <section class="visual app-shot" aria-label="Mochimono library grid preview"><div class="window" aria-hidden="true"><div class="windowbar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="window-title"></span><span class="window-actions"><i class="pill"></i><i class="pill"></i></span></div><div class="appbody"><aside class="sidebar"><div class="side-row active"><i class="side-icon"></i><i class="side-line"></i></div><div class="side-row"><i class="side-icon"></i><i class="side-line"></i></div><div class="side-row"><i class="side-icon"></i><i class="side-line"></i></div><div class="side-row"><i class="side-icon"></i><i class="side-line"></i></div><div class="source-mini"><i class="source"></i><i class="source"></i><i class="source"></i></div></aside><div class="content"><div class="content-tools"><i class="search"></i><i class="tool-square first"></i><i class="tool-square"></i><i class="tool-square"></i></div><div class="grid"><i class="thumb"></i><i class="thumb"></i><i class="thumb"></i><i class="thumb"></i><i class="thumb"></i><i class="thumb"></i><i class="thumb"></i><i class="thumb"></i><i class="thumb"></i><i class="thumb"></i><i class="thumb"></i><i class="thumb"></i><i class="thumb"></i><i class="thumb"></i><i class="thumb"></i></div></div></div></div></section>
