<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Mochimono is a cozy cloud home for all your stuff.">
  <meta name="theme-color" content="#0d0c0e">
  <title>Mochimono — a cozy home for all your stuff</title>
  <style>
    :root{color-scheme:dark;--ink:#f6efeb;--muted:#a99e9a;--paper:#0d0c0e;--line:#30292e;--pink:#f2a19b}
    *{box-sizing:border-box}html{background:var(--paper)}body{margin:0;color:var(--ink);background:radial-gradient(circle at 13% 4%,#30191f 0,transparent 29rem),radial-gradient(circle at 92% 30%,#21171d 0,transparent 25rem),var(--paper);font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.45}a{color:inherit}.wrap{width:min(900px,calc(100% - 32px));margin:auto}
    nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:850;text-decoration:none;letter-spacing:-.03em}.jp{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-left:5px;font-weight:650}.github{font-size:13px;font-weight:750;text-decoration:none;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#151216}.github:hover{border-color:#52444b;background:#1c181c}.mini{width:31px;height:25px;border:2px solid #6c5b61;border-radius:50% 50% 43% 43%/60% 60% 40% 40%;background:#faf4ef;position:relative}.mini:before,.mini:after{content:"";position:absolute;top:10px;width:3px;height:4px;border-radius:50%;background:#514642}.mini:before{left:8px}.mini:after{right:8px}
    main{padding:76px 0 70px}.hero{display:grid;grid-template-columns:1.35fr .65fr;align-items:center;gap:54px}h1{max-width:650px;font-size:clamp(54px,7.8vw,82px);line-height:.94;letter-spacing:-.07em;margin:0}.actions{display:flex;align-items:center;margin-top:28px}.button{display:inline-flex;padding:11px 16px;border-radius:999px;background:var(--ink);color:#171214;text-decoration:none;font-size:14px;font-weight:850}.button:hover{background:white}
    .mascot{height:245px;display:grid;place-items:center;position:relative}.sun{position:absolute;width:215px;height:215px;background:linear-gradient(145deg,#47262d,#2a1a20);border:1px solid #4e3037;border-radius:50%;box-shadow:inset 0 0 55px rgba(244,164,153,.05),0 25px 70px rgba(0,0,0,.25)}.character{position:relative;width:176px;height:150px;display:grid;place-items:end center;z-index:2;animation:bob 4.5s ease-in-out infinite}.mochi{width:155px;height:126px;position:relative;z-index:2;background:radial-gradient(circle at 33% 18%,#fff 0 7px,transparent 8px),linear-gradient(145deg,#fff,#f5ece6);border:2px solid #d9c9c3;border-radius:49% 51% 44% 44%/59% 58% 42% 41%;box-shadow:0 28px 55px rgba(0,0,0,.34),inset -10px -9px 20px rgba(183,153,145,.13)}.mochi:before,.mochi:after{content:"";position:absolute;top:51px;width:7px;height:10px;background:#4c413f;border-radius:50%}.mochi:before{left:47px}.mochi:after{right:47px}.mouth{position:absolute;left:50%;top:70px;width:17px;height:9px;margin-left:-8px;border-bottom:3px solid #8b6b66;border-radius:50%}.mouth:before,.mouth:after{content:"";position:absolute;top:-2px;width:19px;height:8px;border-radius:50%;background:rgba(239,145,136,.2)}.mouth:before{left:-43px}.mouth:after{right:-43px}.hair-flower{position:absolute;z-index:4;left:20px;top:25px;color:var(--pink);font-size:29px;line-height:1;transform:rotate(-14deg);filter:drop-shadow(0 2px 0 rgba(255,255,255,.55)) drop-shadow(0 4px 8px rgba(0,0,0,.28))}@keyframes bob{50%{transform:translateY(-5px)}}
    @media(max-width:720px){main{padding-top:34px}.hero{grid-template-columns:1fr;text-align:center;gap:18px}.mascot{order:-1;height:185px}.sun{width:170px;height:170px}.character{transform:scale(.86);animation:none}.actions{justify-content:center}h1{font-size:clamp(50px,13vw,70px)}}
    @media(max-width:430px){.wrap{width:calc(100% - 22px)}.mascot{height:155px}.sun{width:142px;height:142px}.character{transform:scale(.73)}.button{justify-content:center}}
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="brand" href="#"><span class="mini"></span><span>Mochimono <span class="jp">持ち物</span></span></a>
      <a class="github" href="https://github.com/farzher/mochimono">GitHub ↗</a>
    </nav>

    <main>
      <section class="hero">
        <div>
          <h1>A cozy home<br>for all your stuff.</h1>
          <div class="actions"><a class="button" href="https://github.com/farzher/mochimono">View on GitHub</a></div>
        </div>
        <div class="mascot" aria-label="Smiling mochi mascot">
          <div class="sun"></div>
          <div class="character"><span class="hair-flower" aria-hidden="true">✿</span><div class="mochi"><span class="mouth"></span></div></div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
