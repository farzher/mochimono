<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Mochimono squishes duplicate files from overlapping folders and backups into one deduplicated cloud library.">
<meta name="theme-color" content="#0d0c0e">
<title>Mochimono — Squish your stuff</title>
<style>
:root{color-scheme:dark;--ink:#f6efeb;--muted:#a99e9a;--paper:#0d0c0e;--line:#30292e;--pink:#f2a19b;--coral:#b97a70;--teal:#5f8078;--blue:#647d98;--plum:#857090;--olive:#75806a;--sand:#8f7a67}
*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--ink);background:radial-gradient(circle at 13% 3%,#30191f 0,transparent 29rem),radial-gradient(circle at 88% 37%,#21171d 0,transparent 27rem),var(--paper);font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,sans-serif}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}
nav{height:72px;display:flex;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:-.03em;white-space:nowrap}.brand-copy{display:flex;align-items:baseline;gap:5px}.jp{font-size:11px;color:var(--muted);letter-spacing:.08em;font-weight:650}.stuff{font-size:10px;color:#746b6a;font-weight:600}.mini{flex:0 0 auto;width:31px;height:25px;border:2px solid #6c5b61;border-radius:50% 50% 43% 43%/60% 60% 40% 40%;background:#faf4ef;position:relative}.mini:before,.mini:after{content:"";position:absolute;top:10px;width:3px;height:4px;border-radius:50%;background:#514642}.mini:before{left:8px}.mini:after{right:8px}
main{padding:64px 0 96px}.hero{display:grid;grid-template-columns:minmax(0,1fr) 230px;align-items:center;gap:64px;min-height:290px}.hero-copy{min-width:0}h1{margin:0;font-size:clamp(58px,6.8vw,82px);line-height:.94;letter-spacing:-.07em;white-space:nowrap}.tagline{margin:16px 0 0;font-size:clamp(22px,2.3vw,30px);font-weight:760;letter-spacing:-.04em;color:#ddd0cc}.mascot{height:245px;display:grid;place-items:center;position:relative}.sun{position:absolute;width:215px;height:215px;background:linear-gradient(145deg,#47262d,#2a1a20);border:1px solid #4e3037;border-radius:50%;box-shadow:inset 0 0 55px rgba(244,164,153,.05),0 25px 70px rgba(0,0,0,.25)}
.mochi-character{--scale:1;position:relative;z-index:3;display:grid;place-items:center;scale:var(--scale);animation:mochi-bob 3.6s ease-in-out infinite}.mochi-shell{--w:155px;--h:126px;--eye-y:51px;--eye-x:47px;--blush-y:66px;--blush-x:30px;--mouth-y:70px;--flower-size:29px;--flower-x:19px;--flower-y:23px;width:var(--w);height:var(--h);position:relative;background:radial-gradient(circle at 33% 18%,#fff 0 7px,transparent 8px),linear-gradient(145deg,#fff,#f5ece6);border:2px solid #d9c9c3;border-radius:49% 51% 44% 44%/59% 58% 42% 41%;box-shadow:0 28px 55px rgba(0,0,0,.34),inset -10px -9px 20px rgba(183,153,145,.13)}.eye{position:absolute;top:var(--eye-y);width:7px;height:10px;background:#4c413f;border-radius:50%;transform-origin:center;animation:blink 5.6s infinite}.eye.left{left:var(--eye-x)}.eye.right{right:var(--eye-x)}.blush{position:absolute;top:var(--blush-y);width:19px;height:8px;border-radius:50%;background:rgba(239,145,136,.22)}.blush.left{left:var(--blush-x)}.blush.right{right:var(--blush-x)}.smile{position:absolute;left:50%;top:var(--mouth-y);width:17px;height:9px;margin-left:-8px;border-bottom:3px solid #8b6b66;border-radius:50%}.flower{position:absolute;left:var(--flower-x);top:var(--flower-y);color:var(--pink);font-size:var(--flower-size);line-height:1;transform-origin:45% 80%;animation:flower-sway 3.3s ease-in-out infinite;filter:drop-shadow(0 2px 0 rgba(255,255,255,.55)) drop-shadow(0 4px 8px rgba(0,0,0,.28))}
.story{margin-top:92px;position:relative;border:1px solid var(--line);border-radius:32px;background:linear-gradient(180deg,rgba(27,22,26,.96),rgba(14,12,14,.94));box-shadow:0 30px 90px rgba(0,0,0,.22);overflow:hidden;isolation:isolate}.story:before{content:"";position:absolute;inset:-20% 35% auto;height:360px;background:radial-gradient(circle,rgba(242,161,155,.09),transparent 66%);pointer-events:none}.story-grid{position:relative;z-index:1;min-height:530px;padding:58px 46px;display:grid;grid-template-columns:minmax(300px,.92fr) minmax(380px,1.08fr);align-items:center;gap:52px}
.sources{display:grid;gap:18px;position:relative}.folder{position:relative;height:112px;padding:24px 14px 14px;border:1px solid #55464d;border-radius:17px;background:linear-gradient(160deg,#352a30,#1d181c);box-shadow:0 16px 34px rgba(0,0,0,.22);transform:rotate(var(--r));transition:opacity .45s ease,transform .65s cubic-bezier(.2,.8,.2,1)}.folder:before{content:"";position:absolute;left:16px;top:-10px;width:67px;height:21px;border:1px solid #55464d;border-bottom:0;border-radius:10px 10px 0 0;background:#352a30}.folder:nth-child(1){--r:-1.4deg}.folder:nth-child(2){--r:1deg;transform:translateX(12px) rotate(var(--r))}.folder:nth-child(3){--r:-.7deg;transform:translateX(3px) rotate(var(--r))}.story.departed .folder{opacity:.38;transform:translateX(14px) scale(.97) rotate(0)}.folder-grid{height:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.file{position:relative;min-width:0;border-radius:9px;border:1px solid rgba(255,255,255,.07);box-shadow:0 7px 15px rgba(0,0,0,.15);background:var(--fill);overflow:hidden}.file:before{content:"";position:absolute;right:0;top:0;width:0;height:0;border-top:9px solid rgba(255,255,255,.16);border-left:9px solid transparent}.coral{--fill:var(--coral)}.teal{--fill:var(--teal)}.blue{--fill:var(--blue)}.plum{--fill:var(--plum)}.olive{--fill:var(--olive)}.sand{--fill:var(--sand)}.src-file{transition:opacity .3s ease,transform .3s ease}.story.departed .src-file{opacity:.06;transform:scale(.82)}
.library-wrap{position:relative;z-index:2;min-height:430px;display:grid;align-items:end}.cloud-home{position:relative;min-height:430px;display:grid;align-content:end;justify-items:center}.cloud-home:before{content:"";position:absolute;inset:44px 18px 14px;z-index:0;border-radius:120px;background:radial-gradient(circle at 19% 68%,rgba(28,23,27,.97) 0 64px,transparent 66px),radial-gradient(circle at 40% 44%,rgba(28,23,27,.97) 0 88px,transparent 90px),radial-gradient(circle at 63% 52%,rgba(28,23,27,.97) 0 74px,transparent 76px),radial-gradient(circle at 82% 69%,rgba(28,23,27,.97) 0 60px,transparent 62px),linear-gradient(180deg,rgba(28,23,27,.98),rgba(17,15,18,.98));filter:drop-shadow(0 22px 40px rgba(0,0,0,.28))}.cloud-home:after{content:"";position:absolute;inset:36px 8px 10px;z-index:0;border-radius:140px;background:radial-gradient(circle,rgba(242,161,155,.05),transparent 68%);filter:blur(10px);opacity:.85}.cloud-mascot{--scale:.82;position:absolute;right:42px;top:22px;z-index:3;animation:mochi-bob 3.6s ease-in-out infinite}.cloud-mascot .mochi-shell{--w:126px;--h:102px;--eye-y:41px;--eye-x:38px;--blush-y:54px;--blush-x:24px;--mouth-y:58px;--flower-size:24px;--flower-x:15px;--flower-y:18px;box-shadow:0 20px 45px rgba(0,0,0,.32),inset -8px -8px 17px rgba(183,153,145,.12)}.cloud-mascot .blush{width:15px;height:6px}.cloud-mascot .smile{width:15px;height:8px;margin-left:-7px}
.library{position:relative;z-index:2;width:min(100%,420px);height:312px;border:1px solid #3b3035;border-radius:21px;background:#0d0c0e;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.32);display:grid;grid-template-rows:44px 1fr;margin-bottom:36px}.library-top{border-bottom:1px solid #2e272b;display:flex;align-items:center;gap:7px;padding:0 13px;background:#151216}.window-dot{width:8px;height:8px;border-radius:50%;background:#4e4247}.window-dot:first-child{background:#725057}.cloud-badge{margin-left:8px;width:28px;height:20px;position:relative}.cloud-icon{position:absolute;left:4px;top:8px;width:20px;height:8px;border-radius:999px;background:#453a40}.cloud-icon:before,.cloud-icon:after{content:"";position:absolute;bottom:2px;border-radius:50%;background:#453a40}.cloud-icon:before{left:2px;width:9px;height:9px}.cloud-icon:after{right:2px;width:11px;height:11px}.ghost-search{margin-left:4px;width:86px;height:8px;border-radius:99px;background:#30282d}.library-body{padding:15px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:10px;min-height:0}.slot{position:relative;border-radius:12px;background:#151216;border:1px solid #292327;overflow:hidden}.dest-file{position:absolute;inset:0;opacity:.06;transform:scale(.78);transition:opacity .35s ease,transform .55s cubic-bezier(.2,1.3,.25,1)}.dest-file.arrived{opacity:1;transform:scale(1)}.fly-file{position:absolute;z-index:20;pointer-events:none;width:46px;height:46px;will-change:transform,opacity;box-shadow:0 14px 28px rgba(0,0,0,.32)}
@keyframes mochi-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes blink{0%,45%,47%,100%{transform:scaleY(1)}46%{transform:scaleY(.12)}}@keyframes flower-sway{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(-7deg)}}
@media(max-width:940px){.story-grid{grid-template-columns:1fr;gap:34px;padding:42px 30px}.library-wrap{min-height:390px}.cloud-home{min-height:390px}.cloud-home:before{inset:34px 8px 8px}.cloud-mascot{right:24px;top:16px;--scale:.74}.library{width:min(100%,440px);margin-bottom:28px}}
@media(max-width:820px){main{padding-top:32px}.hero{grid-template-columns:1fr;text-align:center;gap:14px}.mascot{order:-1;height:185px}.sun{width:170px;height:170px}.hero .mochi-character{--scale:.86}h1{font-size:clamp(50px,13vw,70px);white-space:normal}.tagline{font-size:21px;margin-top:14px}.story{margin-top:62px}.sources{gap:12px}.folder{height:100px;padding:22px 9px 10px}.folder-grid{grid-template-columns:repeat(5,1fr);gap:5px}.library-wrap,.cloud-home{min-height:360px}.cloud-home:before{inset:28px 6px 8px}.cloud-mascot{right:18px;top:12px;--scale:.7}.library{height:300px;max-width:400px}.fly-file{width:42px;height:42px}}
@media(max-width:470px){.wrap{width:calc(100% - 22px)}nav{height:62px}.brand{gap:7px}.brand-copy{gap:4px}.jp,.stuff{font-size:9px}main{padding-bottom:64px}.mascot{height:155px}.sun{width:142px;height:142px}.hero .mochi-character{--scale:.73}.tagline{font-size:20px}.story{border-radius:24px}.story-grid{padding:34px 16px;gap:26px}.folder{height:92px;border-radius:13px}.folder:before{left:10px;width:45px;height:17px}.folder-grid{gap:4px}.file{border-radius:7px}.library-wrap,.cloud-home{min-height:326px}.cloud-home:before{inset:24px 2px 4px;border-radius:80px}.cloud-mascot{right:12px;top:10px;--scale:.6}.library{height:282px;max-width:100%;margin-bottom:22px}.library-body{padding:11px;gap:7px}.slot{border-radius:9px}}
@media(prefers-reduced-motion:reduce){.mochi-character{animation-duration:8s}.flower{animation-duration:8s}.story.departed .folder,.story.departed .src-file{opacity:1;transform:none}.dest-file{opacity:1;transform:none}.fly-file{display:none}}
</style>
</head>
<body>
<div class="wrap">
<nav><div class="brand"><span class="mini" aria-hidden="true"></span><span class="brand-copy"><span>Mochimono</span><span class="jp">もちもの</span><span class="stuff">your stuff</span></span></div></nav>
<main>
<section class="hero">
<div class="hero-copy"><h1>Mochimono</h1><p class="tagline">Squish your stuff</p></div>
<div class="mascot" aria-label="Smiling mochi mascot"><div class="sun"></div><div class="mochi-character"><div class="mochi-shell"><span class="eye left"></span><span class="eye right"></span><span class="blush left"></span><span class="blush right"></span><span class="smile"></span><span class="flower" aria-hidden="true">✿</span></div></div></div>
</section>
<section class="story" id="story" aria-label="Files from overlapping folders and backups squish into one deduplicated cloud library">
<div class="story-grid">
<div class="sources">
<div class="folder"><div class="folder-grid"><div class="file src-file coral" data-file="coral"></div><div class="file src-file teal" data-file="teal"></div><div class="file src-file blue" data-file="blue"></div><div class="file src-file coral" data-file="coral"></div><div class="file src-file plum" data-file="plum"></div></div></div>
<div class="folder"><div class="folder-grid"><div class="file src-file coral" data-file="coral"></div><div class="file src-file teal" data-file="teal"></div><div class="file src-file blue" data-file="blue"></div><div class="file src-file coral" data-file="coral"></div><div class="file src-file plum" data-file="plum"></div></div></div>
<div class="folder"><div class="folder-grid"><div class="file src-file coral" data-file="coral"></div><div class="file src-file teal" data-file="teal"></div><div class="file src-file olive" data-file="olive"></div><div class="file src-file blue" data-file="blue"></div><div class="file src-file sand" data-file="sand"></div></div></div>
</div>
<div class="library-wrap"><div class="cloud-home"><div class="mochi-character cloud-mascot" id="cloudMochi"><div class="mochi-shell"><span class="eye left"></span><span class="eye right"></span><span class="blush left"></span><span class="blush right"></span><span class="smile"></span><span class="flower" aria-hidden="true">✿</span></div></div><div class="library"><div class="library-top"><span class="window-dot"></span><span class="window-dot"></span><span class="window-dot"></span><span class="cloud-badge" aria-hidden="true"><span class="cloud-icon"></span></span><span class="ghost-search"></span></div><div class="library-body"><div class="slot"><div class="file dest-file coral" data-dest="coral"></div></div><div class="slot"><div class="file dest-file teal" data-dest="teal"></div></div><div class="slot"><div class="file dest-file blue" data-dest="blue"></div></div><div class="slot"><div class="file dest-file plum" data-dest="plum"></div></div><div class="slot"><div class="file dest-file olive" data-dest="olive"></div></div><div class="slot"><div class="file dest-file sand" data-dest="sand"></div></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div></div></div></div>
</div>
</section>
</main>
</div>
<script>
(()=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const story=document.getElementById('story'),mochi=document.getElementById('cloudMochi'),sources=[...story.querySelectorAll('.src-file')],dests=[...story.querySelectorAll('.dest-file')];let timer=0,runId=0;const wait=ms=>new Promise(r=>setTimeout(r,ms)),center=(el,box)=>{const r=el.getBoundingClientRect();return{x:r.left-box.left+r.width/2,y:r.top-box.top+r.height/2}};async function run(){const id=++runId;clearTimeout(timer);story.classList.remove('departed');dests.forEach(d=>d.classList.remove('arrived'));story.querySelectorAll('.fly-file').forEach(n=>n.remove());await wait(760);if(id!==runId)return;const box=story.getBoundingClientRect(),mid=center(mochi,box),remaining={};sources.forEach(s=>remaining[s.dataset.file]=(remaining[s.dataset.file]||0)+1);const flies=sources.map((src,i)=>{const key=src.dataset.file,dest=story.querySelector(`[data-dest="${key}"]`),a=center(src,box),b=center(dest,box),fly=src.cloneNode(false);fly.className=src.className.replace('src-file','fly-file');fly.removeAttribute('data-file');story.appendChild(fly);const fw=fly.getBoundingClientRect().width;fly.style.left=(a.x-fw/2)+'px';fly.style.top=(a.y-fw/2)+'px';const anim=fly.animate([{transform:'translate(0,0) scale(1)',opacity:1,offset:0},{transform:`translate(${mid.x-a.x}px,${mid.y-a.y}px) scale(.78)`,opacity:1,offset:.6},{transform:`translate(${mid.x-a.x}px,${mid.y-a.y}px) scale(.16)`,opacity:.56,offset:.7},{transform:`translate(${b.x-a.x}px,${b.y-a.y}px) scale(.5)`,opacity:.16,offset:.78},{transform:`translate(${b.x-a.x}px,${b.y-a.y}px) scale(1)`,opacity:1,offset:1}],{duration:2900,delay:i*42,easing:'cubic-bezier(.58,0,.2,1)',fill:'forwards'});anim.finished.then(()=>{if(id!==runId)return;fly.remove();remaining[key]--;if(remaining[key]===0)dest.classList.add('arrived')}).catch(()=>{});return anim});await wait(700);if(id!==runId)return;story.classList.add('departed');await Promise.allSettled(flies.map(f=>f.finished));if(id!==runId)return;await wait(2800);if(id!==runId)return;story.classList.remove('departed');dests.forEach(d=>d.classList.remove('arrived'));timer=setTimeout(run,700)}run();addEventListener('resize',()=>{runId++;clearTimeout(timer);story.querySelectorAll('.fly-file').forEach(n=>n.remove());timer=setTimeout(run,220)},{passive:true});document.addEventListener('visibilitychange',()=>{if(!document.hidden){runId++;clearTimeout(timer);timer=setTimeout(run,180)}})})();
</script>
</body>
</html>
