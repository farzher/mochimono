<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Mochimono squishes duplicate files from overlapping folders and backups into one deduplicated library.">
  <meta name="theme-color" content="#0d0c0e">
  <title>Mochimono — Squish your stuff</title>
  <style>
    :root{color-scheme:dark;--ink:#f6efeb;--muted:#a99e9a;--paper:#0d0c0e;--line:#30292e;--pink:#f2a19b}
    *{box-sizing:border-box}
    html{background:var(--paper)}
    body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--ink);background:radial-gradient(circle at 13% 3%,#30191f 0,transparent 29rem),radial-gradient(circle at 88% 37%,#21171d 0,transparent 27rem),var(--paper);font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,sans-serif}
    .wrap{width:min(1120px,calc(100% - 40px));margin:auto}
    nav{height:72px;display:flex;align-items:center}
    .brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:-.03em;white-space:nowrap}
    .brand-copy{display:flex;align-items:baseline;gap:5px}.jp{font-size:11px;color:var(--muted);letter-spacing:.08em;font-weight:650}.stuff{font-size:10px;color:#746b6a;font-weight:600}
    .mini{flex:0 0 auto;width:31px;height:25px;border:2px solid #6c5b61;border-radius:50% 50% 43% 43%/60% 60% 40% 40%;background:#faf4ef;position:relative}.mini:before,.mini:after{content:"";position:absolute;top:10px;width:3px;height:4px;border-radius:50%;background:#514642}.mini:before{left:8px}.mini:after{right:8px}

    main{padding:64px 0 96px}.hero{display:grid;grid-template-columns:minmax(0,1fr) 230px;align-items:center;gap:64px;min-height:290px}.hero-copy{min-width:0}h1{font-size:clamp(58px,6.8vw,82px);line-height:.94;letter-spacing:-.07em;margin:0;white-space:nowrap}.tagline{margin:18px 0 0;color:var(--muted);font-size:clamp(20px,2.1vw,27px);font-weight:750;letter-spacing:-.035em}
    .mascot{height:245px;display:grid;place-items:center;position:relative}.sun{position:absolute;width:215px;height:215px;background:linear-gradient(145deg,#47262d,#2a1a20);border:1px solid #4e3037;border-radius:50%;box-shadow:inset 0 0 55px rgba(244,164,153,.05),0 25px 70px rgba(0,0,0,.25)}.character{--scale:1;position:relative;width:176px;height:150px;display:grid;place-items:end center;z-index:2;animation:bob 4.5s ease-in-out infinite}.mochi{width:155px;height:126px;position:relative;background:radial-gradient(circle at 33% 18%,#fff 0 7px,transparent 8px),linear-gradient(145deg,#fff,#f5ece6);border:2px solid #d9c9c3;border-radius:49% 51% 44% 44%/59% 58% 42% 41%;box-shadow:0 28px 55px rgba(0,0,0,.34),inset -10px -9px 20px rgba(183,153,145,.13)}.mochi:before,.mochi:after{content:"";position:absolute;top:51px;width:7px;height:10px;background:#4c413f;border-radius:50%}.mochi:before{left:47px}.mochi:after{right:47px}.mouth{position:absolute;left:50%;top:70px;width:17px;height:9px;margin-left:-8px;border-bottom:3px solid #8b6b66;border-radius:50%}.mouth:before,.mouth:after{content:"";position:absolute;top:-2px;width:19px;height:8px;border-radius:50%;background:rgba(239,145,136,.2)}.mouth:before{left:-43px}.mouth:after{right:-43px}.hair-flower{position:absolute;z-index:4;left:20px;top:25px;color:var(--pink);font-size:29px;line-height:1;transform:rotate(-14deg);filter:drop-shadow(0 2px 0 rgba(255,255,255,.55)) drop-shadow(0 4px 8px rgba(0,0,0,.28))}

    .story{margin-top:92px;position:relative;border:1px solid var(--line);border-radius:32px;background:linear-gradient(180deg,rgba(27,22,26,.96),rgba(14,12,14,.94));box-shadow:0 30px 90px rgba(0,0,0,.22);overflow:hidden;isolation:isolate}.story:before{content:"";position:absolute;inset:-20% 35% auto;height:360px;background:radial-gradient(circle,rgba(242,161,155,.09),transparent 66%);pointer-events:none}.story-grid{position:relative;z-index:1;min-height:500px;padding:58px 46px;display:grid;grid-template-columns:minmax(230px,.9fr) 150px minmax(300px,1.12fr);align-items:center;gap:34px}
    .sources{display:grid;gap:18px;position:relative}.folder{position:relative;height:118px;padding:24px 14px 14px;border:1px solid #55464d;border-radius:17px;background:linear-gradient(160deg,#352a30,#1d181c);box-shadow:0 16px 34px rgba(0,0,0,.22);transform:rotate(var(--r));transition:opacity .45s ease,transform .65s cubic-bezier(.2,.8,.2,1)}.folder:before{content:"";position:absolute;left:16px;top:-10px;width:67px;height:21px;border:1px solid #55464d;border-bottom:0;border-radius:10px 10px 0 0;background:#352a30}.folder:nth-child(1){--r:-1.6deg}.folder:nth-child(2){--r:1.2deg;transform:translateX(18px) rotate(var(--r))}.folder:nth-child(3){--r:-.7deg;transform:translateX(5px) rotate(var(--r))}.story.departed .folder{opacity:.4}.story.departed .folder:nth-child(1){transform:translateX(14px) scale(.97) rotate(0)}.story.departed .folder:nth-child(2){transform:translateX(26px) scale(.97) rotate(0)}.story.departed .folder:nth-child(3){transform:translateX(18px) scale(.97) rotate(0)}
    .folder-grid{height:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.file{position:relative;min-width:0;border-radius:9px;border:1px solid rgba(255,255,255,.07);box-shadow:0 7px 15px rgba(0,0,0,.15);background:var(--art);overflow:hidden}
    .art-a{--art:#52766c}.art-b{--art:#a86f63}.art-c{--art:#596d80}.art-d{--art:#765f79}.art-e{--art:#80635a}.art-f{--art:#667465}.art-g{--art:#626a75}
    .src-file{transition:opacity .3s ease,transform .3s ease}.story.departed .src-file{opacity:.08;transform:scale(.82)}

    .squisher{height:180px;display:grid;place-items:center;position:relative}.flow-halo{position:absolute;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(242,161,155,.12),transparent 68%);filter:blur(5px)}.flow-mochi{width:118px;height:94px;position:relative;z-index:2;border:2px solid #d8c8c1;background:linear-gradient(145deg,#fff,#f3e9e3);border-radius:49% 51% 44% 44%/59% 58% 42% 41%;box-shadow:0 20px 44px rgba(0,0,0,.34),inset -8px -8px 17px rgba(183,153,145,.12)}.flow-mochi:before,.flow-mochi:after{content:"";position:absolute;top:39px;width:6px;height:8px;border-radius:50%;background:#514642}.flow-mochi:before{left:35px}.flow-mochi:after{right:35px}.flow-smile{position:absolute;top:54px;left:50%;width:15px;height:8px;transform:translateX(-50%);border-bottom:3px solid #8b6b66;border-radius:50%}.flow-mochi.squish{animation:squish .9s cubic-bezier(.2,.9,.25,1)}.squish-ring{position:absolute;width:136px;height:108px;border:2px solid rgba(242,161,155,.55);border-radius:50%;opacity:0}.flow-mochi.squish+.squish-ring{animation:ring .9s ease-out}
    .flow-arrow{position:absolute;top:50%;height:1px;background:linear-gradient(90deg,transparent,#6f5962 30%,#6f5962 70%,transparent);opacity:.45}.flow-arrow:after{content:"";position:absolute;right:9%;top:-4px;width:8px;height:8px;border-right:1px solid #90727e;border-top:1px solid #90727e;transform:rotate(45deg)}.arrow-in{left:-33%;right:66%}.arrow-out{left:66%;right:-33%}

    .library{height:360px;border:1px solid #3b3035;border-radius:21px;background:#0d0c0e;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.32);display:grid;grid-template-rows:44px 1fr;transform:translateY(2px)}.library-top{border-bottom:1px solid #2e272b;display:flex;align-items:center;gap:7px;padding:0 13px;background:#151216}.window-dot{width:8px;height:8px;border-radius:50%;background:#4e4247}.window-dot:first-child{background:#725057}.ghost-search{margin-left:10px;width:92px;height:8px;border-radius:99px;background:#30282d}.ghost-actions{margin-left:auto;display:flex;gap:6px}.ghost-action{width:25px;height:21px;border:1px solid #30292e;border-radius:7px;background:#191519}.library-body{padding:15px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:10px;min-height:0}.slot{position:relative;border-radius:12px;background:#151216;border:1px solid #292327;overflow:hidden}.dest-file{position:absolute;inset:0;opacity:.06;transform:scale(.78);transition:opacity .35s ease,transform .55s cubic-bezier(.2,1.3,.25,1)}.dest-file.arrived{opacity:1;transform:scale(1)}
    .fly-file{position:absolute;z-index:20;pointer-events:none;width:58px;height:58px;will-change:transform,opacity;box-shadow:0 14px 28px rgba(0,0,0,.32)}

    @keyframes bob{0%,100%{transform:translateY(0) scale(var(--scale))}50%{transform:translateY(-5px) scale(var(--scale))}}
    @keyframes squish{0%,100%{transform:scale(1)}27%{transform:scale(1.18,.76)}52%{transform:scale(.82,1.2)}72%{transform:scale(1.08,.91)}}
    @keyframes ring{0%{opacity:.7;transform:scale(.65)}100%{opacity:0;transform:scale(1.45)}}

    @media(max-width:820px){main{padding-top:32px}.hero{grid-template-columns:1fr;text-align:center;gap:14px}.mascot{order:-1;height:185px}.sun{width:170px;height:170px}.character{--scale:.86}h1{font-size:clamp(50px,13vw,70px);white-space:normal}.tagline{font-size:21px;margin-top:14px}.story{margin-top:62px}.story-grid{grid-template-columns:1fr;gap:24px;padding:42px 30px}.sources{grid-template-columns:repeat(3,1fr);gap:10px}.folder{height:106px;padding:22px 9px 10px}.folder:nth-child(2),.folder:nth-child(3){transform:rotate(var(--r))}.folder-grid{grid-template-columns:repeat(2,1fr);gap:6px}.story.departed .folder:nth-child(1),.story.departed .folder:nth-child(2),.story.departed .folder:nth-child(3){transform:scale(.97) rotate(0)}.squisher{height:125px}.flow-arrow{left:50%;right:auto;top:auto;width:1px;height:92px;background:linear-gradient(180deg,transparent,#6f5962 30%,#6f5962 70%,transparent)}.flow-arrow:after{right:-4px;top:auto;bottom:9%;transform:rotate(135deg)}.arrow-in{bottom:100%}.arrow-out{top:100%;bottom:auto}.library{height:340px}.fly-file{width:48px;height:48px}}
    @media(max-width:470px){.wrap{width:calc(100% - 22px)}nav{height:62px}.brand{gap:7px}.brand-copy{gap:4px}.jp,.stuff{font-size:9px}main{padding-bottom:64px}.mascot{height:155px}.sun{width:142px;height:142px}.character{--scale:.73}.story{border-radius:24px}.story-grid{padding:34px 16px;gap:18px}.sources{gap:7px}.folder{height:92px;border-radius:13px}.folder:before{left:10px;width:45px;height:17px}.folder-grid{gap:5px}.file{border-radius:7px}.library{height:315px}.library-body{padding:11px;gap:7px}.slot{border-radius:9px}}
    @media(prefers-reduced-motion:reduce){.character{animation:none}.story.departed .folder,.story.departed .src-file{opacity:1;transform:none}.dest-file{opacity:1;transform:none}.fly-file{display:none}.flow-mochi.squish{animation:none}}
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <div class="brand"><span class="mini" aria-hidden="true"></span><span class="brand-copy"><span>Mochimono</span><span class="jp">もちもの</span><span class="stuff">your stuff</span></span></div>
    </nav>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <h1>Mochimono</h1>
          <p class="tagline">Squish your stuff</p>
        </div>
        <div class="mascot" aria-label="Smiling mochi mascot">
          <div class="sun"></div>
          <div class="character"><span class="hair-flower" aria-hidden="true">✿</span><div class="mochi"><span class="mouth"></span></div></div>
        </div>
      </section>

      <section class="story" id="story" aria-label="Files from overlapping folders squish into one deduplicated library">
        <div class="story-grid">
          <div class="sources">
            <div class="folder"><div class="folder-grid">
              <div class="file src-file art-a" data-file="a"></div><div class="file src-file art-b" data-file="b"></div><div class="file src-file art-c" data-file="c"></div><div class="file src-file art-d" data-file="d"></div>
            </div></div>
            <div class="folder"><div class="folder-grid">
              <div class="file src-file art-a" data-file="a"></div><div class="file src-file art-e" data-file="e"></div><div class="file src-file art-f" data-file="f"></div><div class="file src-file art-c" data-file="c"></div>
            </div></div>
            <div class="folder"><div class="folder-grid">
              <div class="file src-file art-b" data-file="b"></div><div class="file src-file art-g" data-file="g"></div><div class="file src-file art-a" data-file="a"></div><div class="file src-file art-f" data-file="f"></div>
            </div></div>
          </div>

          <div class="squisher">
            <span class="flow-arrow arrow-in"></span><span class="flow-arrow arrow-out"></span>
            <div class="flow-halo"></div>
            <div class="flow-mochi" id="flowMochi"><span class="flow-smile"></span></div><span class="squish-ring"></span>
          </div>

          <div class="library">
            <div class="library-top"><span class="window-dot"></span><span class="window-dot"></span><span class="window-dot"></span><span class="ghost-search"></span><span class="ghost-actions"><span class="ghost-action"></span><span class="ghost-action"></span></span></div>
            <div class="library-body">
              <div class="slot"><div class="file dest-file art-a" data-dest="a"></div></div>
              <div class="slot"><div class="file dest-file art-b" data-dest="b"></div></div>
              <div class="slot"><div class="file dest-file art-c" data-dest="c"></div></div>
              <div class="slot"><div class="file dest-file art-d" data-dest="d"></div></div>
              <div class="slot"><div class="file dest-file art-e" data-dest="e"></div></div>
              <div class="slot"><div class="file dest-file art-f" data-dest="f"></div></div>
              <div class="slot"><div class="file dest-file art-g" data-dest="g"></div></div>
              <div class="slot"></div><div class="slot"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    (()=>{
      if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
      const story=document.getElementById('story');
      const mochi=document.getElementById('flowMochi');
      const sources=[...story.querySelectorAll('.src-file')];
      const dests=[...story.querySelectorAll('.dest-file')];
      let timer=0,runId=0;
      const wait=ms=>new Promise(r=>setTimeout(r,ms));
      const center=(el,box)=>{const r=el.getBoundingClientRect();return{x:r.left-box.left+r.width/2,y:r.top-box.top+r.height/2,w:r.width,h:r.height}};

      async function run(){
        const id=++runId;
        clearTimeout(timer);
        story.classList.remove('departed');
        mochi.classList.remove('squish');
        dests.forEach(d=>d.classList.remove('arrived'));
        story.querySelectorAll('.fly-file').forEach(n=>n.remove());
        await wait(700);if(id!==runId)return;

        const box=story.getBoundingClientRect();
        const mid=center(mochi,box);
        const remaining={};sources.forEach(s=>remaining[s.dataset.file]=(remaining[s.dataset.file]||0)+1);
        const flies=sources.map((src,i)=>{
          const key=src.dataset.file;
          const dest=story.querySelector(`[data-dest="${key}"]`);
          const a=center(src,box),b=center(dest,box);
          const fly=src.cloneNode(false);
          fly.className=src.className.replace('src-file','fly-file');
          fly.removeAttribute('data-file');
          story.appendChild(fly);
          const fw=fly.getBoundingClientRect().width;
          fly.style.left=(a.x-fw/2)+'px';fly.style.top=(a.y-fw/2)+'px';
          const d=i*55;
          const anim=fly.animate([
            {transform:'translate(0,0) scale(1)',opacity:1,offset:0},
            {transform:`translate(${mid.x-a.x}px,${mid.y-a.y}px) scale(.82)`,opacity:1,offset:.55},
            {transform:`translate(${mid.x-a.x}px,${mid.y-a.y}px) scale(.18)`,opacity:.65,offset:.66},
            {transform:`translate(${b.x-a.x}px,${b.y-a.y}px) scale(.58)`,opacity:.18,offset:.72},
            {transform:`translate(${b.x-a.x}px,${b.y-a.y}px) scale(1)`,opacity:1,offset:1}
          ],{duration:2850,delay:d,easing:'cubic-bezier(.58,0,.2,1)',fill:'forwards'});
          anim.finished.then(()=>{if(id!==runId)return;fly.remove();remaining[key]--;if(remaining[key]===0)dest.classList.add('arrived')}).catch(()=>{});
          return anim;
        });

        await wait(620);if(id!==runId)return;story.classList.add('departed');
        await wait(900);if(id!==runId)return;mochi.classList.remove('squish');void mochi.offsetWidth;mochi.classList.add('squish');
        await wait(1350);if(id!==runId)return;
        await Promise.allSettled(flies.map(f=>f.finished));if(id!==runId)return;
        await wait(2300);if(id!==runId)return;
        story.classList.remove('departed');dests.forEach(d=>d.classList.remove('arrived'));
        timer=setTimeout(run,650);
      }
      run();
      addEventListener('resize',()=>{runId++;clearTimeout(timer);story.querySelectorAll('.fly-file').forEach(n=>n.remove());timer=setTimeout(run,220)},{passive:true});
      document.addEventListener('visibilitychange',()=>{if(!document.hidden){runId++;clearTimeout(timer);timer=setTimeout(run,180)}});
    })();
  </script>
</body>
</html>
