<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0c0e">
  <title>Mochimono</title>
  <script>if(new URL(location.href).searchParams.has('file'))document.documentElement.classList.add('viewer-restore-pending')</script>
  <style>html.viewer-restore-pending,html.viewer-restore-pending body{background:#050505}html.viewer-restore-pending .shell{visibility:hidden}</style>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/folders.css">
  <link rel="stylesheet" href="/library-ui.css">
  <link rel="stylesheet" href="/critical-ui.css">
  <link rel="stylesheet" href="/collections.css">
  <link rel="stylesheet" href="/file-info.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="app-brand"><span class="mini" aria-hidden="true"></span><h1>Mochimono</h1></div>
      <div class="top-actions"><div id="stats" class="storage-head"></div><button id="logout" class="logout-button" hidden>Log out</button></div>
    </header>

    <section id="login" class="login" hidden>
      <h2>Connect</h2>
      <form id="login-form"><input id="token" type="password" autocomplete="current-password" placeholder="Server token" required><button>Open</button></form>
      <p id="login-error" class="error"></p>
    </section>

    <div id="app" hidden>
      <section class="library">
        <div class="commandbar">
          <button id="homeButton" class="command-home" type="button" title="All files" aria-label="All files"><span class="mini" aria-hidden="true"></span></button>
          <input id="search" class="search" type="search" placeholder="Search" title="Search normally, or use name:, path:, source:, location:, type:, ext:, or year:">
          <details class="library-filter-menu">
            <summary title="Filters" aria-label="Filters"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 5.25h13M5.75 10h8.5M8 14.75h4"/></svg><span class="library-filter-count" hidden></span></summary>
            <div class="library-filter-popover">
              <label><span>Origin</span><select id="source" aria-label="Origin"><option value="">Origin</option></select></label>
              <label><span>Groups</span><select id="collectionFilter" aria-label="Groups"><option value="">Groups</option></select></label>
              <label><span>Where</span><select id="locationFilter" aria-label="Where files are stored"><option value="">Everywhere</option></select></label>
              <label><span>Type</span><select id="typeFilter" aria-label="File type"><option value="">All files</option><option value="media">Media</option><option value="image">Images</option><option value="video">Video</option><option value="audio">Audio</option><option value="application">Docs</option><option value="other">Other</option></select></label>
              <label><span>Sort</span><select id="sort" aria-label="Sort"><option value="date-desc">Newest</option><option value="date-added">Recently added</option><option value="date-asc">Oldest</option><option value="size-desc">Largest</option></select></label>
            </div>
          </details>
          <span id="fileCount" class="file-count" aria-live="polite"></span>
          <button id="selectFiles" class="select-toggle" hidden aria-hidden="true" tabindex="-1">Select</button>
          <details class="library-size-menu">
            <summary title="Preview size" aria-label="Preview size"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="4" width="12" height="12" rx="1.5"/></svg></summary>
            <div class="library-size-popover">
              <div id="mediaSizeControl" class="media-sizes" aria-label="Preview size">
                <input id="mediaSize" type="range" min="96" max="420" value="170" hidden>
                <button data-media-size="112" title="Small" aria-label="Small previews"><span class="size-glyph size-1"></span></button>
                <button data-media-size="170" title="Medium" aria-label="Medium previews" class="active"><span class="size-glyph size-2"></span></button>
                <button data-media-size="270" title="Large" aria-label="Large previews"><span class="size-glyph size-3"></span></button>
                <button data-media-size="400" title="Extra large" aria-label="Extra large previews"><span class="size-glyph size-4"></span></button>
              </div>
              <button id="gridFolderToggle" class="grid-folders-toggle" type="button" title="Show folders in grid" aria-label="Show folders in grid"><span class="grid-folder-toggle-icon" aria-hidden="true"></span></button>
            </div>
          </details>
          <details class="library-view-menu">
            <summary title="View" aria-label="View"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.5" y="3.5" width="5" height="5" rx=".7"/><rect x="11.5" y="3.5" width="5" height="5" rx=".7"/><rect x="3.5" y="11.5" width="5" height="5" rx=".7"/><rect x="11.5" y="11.5" width="5" height="5" rx=".7"/></svg></summary>
            <div class="library-view-popover">
              <div id="views" class="views" aria-label="View">
                <button data-view="grid" class="active" title="Grid" aria-label="Grid"><svg class="view-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="3.25" y="3.25" width="5.5" height="5.5" rx=".8"/><rect x="11.25" y="3.25" width="5.5" height="5.5" rx=".8"/><rect x="3.25" y="11.25" width="5.5" height="5.5" rx=".8"/><rect x="11.25" y="11.25" width="5.5" height="5.5" rx=".8"/></svg></button>
                <button data-view="list" title="List" aria-label="List"><svg class="view-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5.25h1M8 5.25h8M4 10h1M8 10h8M4 14.75h1M8 14.75h8"/></svg></button>
                <button data-view="folders" title="Folders" aria-label="Folders"><svg class="view-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.75 6.25h5l1.6-2h3.2l1.25 2h3.45v9.5H2.75z"/></svg></button>
              </div>
            </div>
          </details>
          <div id="selectionBar" class="selection-bar" hidden>
            <strong id="selectionCount">0 selected</strong>
            <button id="selectAll" title="Select all" aria-label="Select all"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.2l3.1 3.1L16 4.8"/></svg></button>
            <button id="selectionCollection" title="Add to group" aria-label="Add to group"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg></button>
            <span class="selection-spacer"></span>
            <button id="selectionDelete" title="Trash" aria-label="Trash"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 6.5h9l-.6 10H6.1zM4 4.5h12M8 4.5V3h4v1.5"/></svg></button>
            <button id="selectionIgnore" class="selection-danger" title="Trash + Ignore" aria-label="Trash + Ignore"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 6.5h8l-.55 9H6.55zM4.5 4.5h11M8 4.5V3h4v1.5M3.5 16.5l13-13"/></svg></button>
            <button id="selectionClear" aria-label="Clear selection" title="Clear selection">×</button>
          </div>
        </div>
        <div id="folderbar" class="folderbar" hidden></div>
        <section id="gridFolderStrip" class="grid-folder-strip" hidden></section>
        <div id="files" class="files grid"></div>
        <div id="scroll-sentinel" style="height:1px" hidden></div>
        <nav id="dateRail" class="date-rail" aria-label="Browse library" hidden></nav>
      </section>
      <details class="protection"><summary>Protection</summary><div id="drives" class="drives"></div></details>
    </div>
  </main>

  <div id="viewer" class="viewer" hidden>
    <div class="viewer-bar"><button id="viewer-close" class="viewer-icon" aria-label="Close">×</button><div class="viewer-title"><strong id="viewer-name"></strong><div class="viewer-title-sub"><span id="viewer-meta"></span><div id="viewer-context" class="viewer-context"></div></div></div><div class="viewer-actions"><button id="viewer-reveal-local" class="viewer-action viewer-reveal-local" type="button" hidden title="Show in Explorer" aria-label="Show in Explorer"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.7 5.8h5l1.5-1.9h2.5l1.3 1.9h4.3v9.3H2.7z"/><path d="M7.2 10h5.6M10.9 7.7l2.3 2.3-2.3 2.3"/></svg></button><a id="viewer-open" class="viewer-action" target="_blank">Open</a><details id="viewer-menu" class="viewer-menu"><summary aria-label="More">•••</summary><div><button id="viewer-info-button" class="viewer-menu-action" type="button">Details</button><button id="delete" class="viewer-menu-action">Trash</button><button id="delete-ignore" class="viewer-menu-action danger-text">Trash + Ignore</button></div></details></div></div>
    <div id="viewerCollections" class="viewer-collections"></div>
    <div id="viewer-stage" class="viewer-stage"><button id="viewer-prev" class="viewer-nav viewer-prev" aria-label="Previous">‹</button><div id="viewer-media" class="viewer-media"></div><button id="viewer-next" class="viewer-nav viewer-next" aria-label="Next">›</button></div>
    <aside id="viewerInfo" class="viewer-info" hidden></aside>
  </div>

  <script type="module" src="/server-login.js"></script>
  <script src="/viewer-touch.js"></script>
  <script type="module" src="/browser-shortcuts.js"></script>
  <script type="module" src="/instant-grid.js"></script>
  <script type="module" src="/catalog-cache.js"></script>
  <script type="module" src="/thumbs.js"></script>
  <script type="module" src="/media-stability.js"></script>
  <script type="module" src="/grid-performance.js"></script>
  <script type="module" src="/fast-arrow-nav.js"></script>
  <script type="module" src="/page-keys.js"></script>
  <script type="module" src="/library-app.js"></script>
  <script type="module" src="/locations.js"></script>
  <script type="module" src="/provider-actions.js"></script>
  <script type="module" src="/gallery.js"></script>
  <script type="module" src="/viewer-url.js"></script>
  <script type="module" src="/browser-ui.js"></script>
  <script type="module" src="/library-ui.js"></script>
  <script type="module" src="/context-ui.js"></script>
  <script type="module" src="/collections.js"></script>
  <script type="module" src="/minimal-toolbar.js"></script>
  <script type="module" src="/file-info.js"></script>
  <script type="module" src="/image-optimize.js"></script>
  <script type="module" src="/image-optimize-zoom.js"></script>
  <script type="module" src="/protection-actions.js"></script>
  <script type="module" src="/local-reveal.js"></script>
  <script type="module" src="/folder-url.js"></script>
  <script type="module" src="/home.js"></script>
</body>
</html>
