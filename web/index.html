<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0c0e">
  <title>Mochimono</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/folders.css">
</head>
<body>
  <main class="shell">
    <header>
      <div class="app-brand">
        <span class="mini" aria-hidden="true"></span>
        <h1>Mochimono</h1>
      </div>
      <button id="logout" class="quiet" hidden>Log out</button>
    </header>

    <section id="login" class="card login" hidden>
      <h2>Connect</h2>
      <form id="login-form">
        <input id="token" type="password" autocomplete="current-password" placeholder="Server token" required>
        <button>Open</button>
      </form>
      <p id="login-error" class="error"></p>
    </section>

    <div id="app" hidden>
      <section id="stats" class="stats"></section>

      <section id="library-card" class="card library-card">
        <div class="toolbar">
          <input id="search" type="search" placeholder="Search">
          <div class="library-filters">
            <select id="source" aria-label="Source"><option value="">All sources</option></select>
            <button id="inbox" class="inbox-toggle">Inbox</button>
            <button id="unbacked" class="backup-toggle">Unbacked</button>
            <div id="filters" class="segmented">
              <button data-type="" class="active">All</button>
              <button data-type="image">Images</button>
              <button data-type="video">Video</button>
              <button data-type="audio">Audio</button>
              <button data-type="application">Docs</button>
              <button data-type="other">Other</button>
            </div>
          </div>
          <div class="library-tools">
            <select id="sort" aria-label="Sort">
              <option value="date-desc">Newest</option>
              <option value="date-asc">Oldest</option>
              <option value="name">Name</option>
              <option value="size-desc">Largest</option>
            </select>
            <div id="views" class="segmented compact">
              <button data-view="grid" class="active">Grid</button>
              <button data-view="list">List</button>
              <button data-view="folders">Folders</button>
            </div>
          </div>
        </div>
        <div id="folderbar" class="folderbar" hidden></div>
        <div id="files" class="files grid"></div>
        <div id="scroll-sentinel" style="height:1px" hidden></div>
        <nav id="dateRail" class="date-rail" aria-label="Dates" hidden></nav>
      </section>

      <section class="card">
        <div class="section-head"><h2>Backups</h2></div>
        <div id="drives" class="drives"></div>
      </section>
    </div>
  </main>

  <dialog id="details">
    <button id="close-details" class="dialog-close quiet" aria-label="Close">×</button>
    <button id="detail-prev" class="detail-nav detail-prev" aria-label="Previous">‹</button>
    <button id="detail-next" class="detail-nav detail-next" aria-label="Next">›</button>
    <div id="detail-preview" class="detail-preview"></div>
    <div class="detail-body">
      <div class="detail-title-row">
        <div>
          <h2 id="detail-name"></h2>
          <p id="detail-meta"></p>
        </div>
        <a id="detail-open" class="button-link" target="_blank">Open</a>
      </div>
      <div class="review-zone">
        <strong id="review-status"></strong>
        <button id="review-toggle"></button>
      </div>
      <h3>Locations</h3>
      <div id="detail-sources" class="sources"></div>
      <h3 class="detail-section">Backups</h3>
      <div id="detail-backups" class="sources"></div>
      <div class="danger-zone">
        <strong>Remove</strong>
        <div class="danger-actions">
          <button id="delete" class="quiet">Delete</button>
          <button id="delete-ignore" class="danger">Delete + Ignore</button>
        </div>
      </div>
    </div>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
