<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0c0e">
  <title>Mochimono</title>
  <script>if(new URL(location.href).searchParams.has('file'))document.documentElement.classList.add('viewer-restore-pending')</script>
  <style>html.viewer-restore-pending,html.viewer-restore-pending body{background:#050505}html.viewer-restore-pending .shell{visibility:hidden}</style>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/folders.css">
  <link rel="stylesheet" href="/library-ui.css">
  <link rel="stylesheet" href="/collections.css">
  <link rel="stylesheet" href="/file-info.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="app-brand"><span class="mini" aria-hidden="true"></span><h1>Mochimono</h1></div>
      <div class="top-actions">
        <div id="stats" class="storage-head"></div>
        <button id="logout" class="logout-button" hidden>Log out</button>
      </div>
    </header>

    <section id="login" class="login" hidden>
      <h2>Connect</h2>
      <form id="login-form">
        <input id="token" type="password" autocomplete="current-password" placeholder="Server token" required>
        <button>Open</button>
      </form>
      <p id="login-error" class="error"></p>
    </section>

    <div id="app" hidden>
      <section class="library">
        <div class="commandbar">
          <input id="search" class="search" type="search" placeholder="Search files and paths" title="Search normally, or use name:, path:, source:, type:, ext:, or year:">
          <select id="source" aria-label="Source"><option value="">All sources</option></select>
          <select id="collectionFilter" aria-label="Collection"><option value="">Collections</option></select>
          <select id="typeFilter" aria-label="File type">
            <option value="">All files</option>
            <option value="media">Media</option>
            <option value="image">Images</option>
            <option value="video">Video</option>
            <option value="audio">Audio</option>
            <option value="application">Docs</option>
            <option value="other">Other</option>
          </select>
          <select id="sort" aria-label="Sort">
            <option value="date-desc">Newest</option>
            <option value="date-asc">Oldest</option>
            <option value="size-desc">Largest</option>
          </select>
          <button id="selectFiles" class="select-toggle" hidden aria-hidden="true" tabindex="-1">Select</button>
          <div id="mediaSizeControl" class="media-sizes" aria-label="Preview size">
            <input id="mediaSize" type="range" min="96" max="420" value="170" hidden>
            <button data-media-size="112" title="Small" aria-label="Small previews"><span class="size-glyph size-1"></span></button>
            <button data-media-size="170" title="Medium" aria-label="Medium previews" class="active"><span class="size-glyph size-2"></span></button>
            <button data-media-size="270" title="Large" aria-label="Large previews"><span class="size-glyph size-3"></span></button>
            <button data-media-size="400" title="Extra large" aria-label="Extra large previews"><span class="size-glyph size-4"></span></button>
          </div>
          <div id="views" class="views" aria-label="View">
            <button data-view="grid" class="active" title="Grid" aria-label="Grid"><svg class="view-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="3.25" y="3.25" width="5.5" height="5.5" rx=".8"/><rect x="11.25" y="3.25" width="5.5" height="5.5" rx=".8"/><rect x="3.25" y="11.25" width="5.5" height="5.5" rx=".8"/><rect x="11.25" y="11.25" width="5.5" height="5.5" rx=".8"/></svg></button>
            <button data-view="list" title="List" aria-label="List"><svg class="view-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5.25h1M8 5.25h8M4 10h1M8 10h8M4 14.75h1M8 14.75h8"/></svg></button>
            <button data-view="folders" title="Folders" aria-label="Folders"><svg class="view-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.75 6.25h5l1.6-2h3.2l1.25 2h3.45v9.5H2.75z"/></svg></button>
          </div>
        </div>
        <div id="collectionStrip" class="collection-strip" hidden></div>
        <div id="selectionBar" class="selection-bar" hidden>
          <strong id="selectionCount">0 selected</strong>
          <button id="selectAll">Select all</button>
          <button id="selectionCollection">Add to collection</button>
          <span class="selection-spacer"></span>
          <button id="selectionDelete">Delete</button>
          <button id="selectionIgnore" class="selection-danger">Delete + Ignore</button>
          <button id="selectionClear" aria-label="Clear selection" title="Clear selection">×</button>
        </div>

        <div id="folderbar" class="folderbar" hidden></div>
        <div id="files" class="files grid"></div>
        <div id="scroll-sentinel" style="height:1px" hidden></div>
        <nav id="dateRail" class="date-rail" aria-label="Browse library" hidden></nav>
      </section>

      <details class="protection">
        <summary>Protection</summary>
        <div id="drives" class="drives"></div>
      </details>
    </div>
  </main>

  <div id="viewer" class="viewer" hidden>
    <div class="viewer-bar">
      <button id="viewer-close" class="viewer-icon" aria-label="Close">×</button>
      <div class="viewer-title"><strong id="viewer-name"></strong><span id="viewer-meta"></span></div>
      <div class="viewer-actions">
        <button id="viewer-info-button" class="viewer-action" type="button">Info</button>
        <a id="viewer-open" class="viewer-action" target="_blank">Open</a>
        <details id="viewer-menu" class="viewer-menu">
          <summary aria-label="More">•••</summary>
          <div><button id="delete" class="viewer-menu-action">Delete</button><button id="delete-ignore" class="viewer-menu-action danger-text">Delete + Ignore</button></div>
        </details>
      </div>
    </div>
    <div id="viewerCollections" class="viewer-collections"></div>
    <div id="viewer-stage" class="viewer-stage">
      <button id="viewer-prev" class="viewer-nav viewer-prev" aria-label="Previous">‹</button>
      <div id="viewer-media" class="viewer-media"></div>
      <button id="viewer-next" class="viewer-nav viewer-next" aria-label="Next">›</button>
    </div>
    <aside id="viewerInfo" class="viewer-info" hidden></aside>
  </div>

  <script src="/browser-shortcuts.js"></script>
  <script src="/viewer-touch.js"></script>
  <script src="/viewer-desktop.js"></script>
  <script type="module" src="/search-query.js"></script>
  <script type="module" src="/app.js"></script>
  <script type="module" src="/thumbs.js"></script>
  <script type="module" src="/gallery.js"></script>
  <script type="module" src="/viewer-url.js"></script>
  <script type="module" src="/browser-ui.js"></script>
  <script type="module" src="/library-ui.js"></script>
  <script type="module" src="/collections.js"></script>
  <script type="module" src="/file-info.js"></script>
  <script type="module" src="/folder-url.js"></script>
</body>
</html>
