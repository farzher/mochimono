<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0d0c0e">
  <title>Mochimono</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/client-shell.css">
</head>
<body class="client-library-active">
  <header class="client-header">
    <div class="app-brand"><span class="mini" aria-hidden="true"></span><h1>Mochimono</h1></div>
    <div class="client-head-actions">
      <div id="serverStorage" class="client-storage" hidden title="Cloud storage">
        <span id="serverStorageText"></span>
        <i><b id="serverStorageBar"></b></i>
      </div>
      <details class="client-menu">
        <summary aria-label="Mochimono menu" title="More">•••</summary>
        <div class="client-menu-popover">
          <nav class="client-tabs" aria-label="Mochimono">
            <button data-client-tab="storage">Storage</button>
          </nav>
          <button id="deviceButton" class="device-button"><span class="menu-label">Settings</span><span id="deviceLabel"></span></button>
          <button id="clientProtection" class="device-button"><span class="menu-label">Protection</span></button>
          <button id="clientConnect" class="client-logout" hidden>Connect Cloud</button>
          <button id="clientLogout" class="client-logout" hidden>Log out</button>
        </div>
      </details>
    </div>
  </header>

  <main id="filesPane" class="files-pane">
    <iframe id="filesFrame" src="/files/" title="Mochimono Library"></iframe>
  </main>

  <main id="storagePane" class="dashboard" hidden>
    <section class="dashboard-section storage-folders-section">
      <h2 class="storage-visually-hidden">Folders</h2>
      <div id="folderAdd" class="folder-add" hidden aria-hidden="true">
        <div class="folder-path-row">
          <input id="importPath" placeholder="Folder or drive">
          <button id="chooseImport" class="secondary">Choose</button>
        </div>
        <div class="folder-mode-options">
          <button id="startBrowse" class="folder-mode-option" title="View and search this folder locally">
            <strong>Local</strong><span>Keep files where they are</span>
          </button>
          <button id="startImport" class="folder-mode-option protect" title="Keep a Cloud copy too">
            <strong>Cloud</strong><span>Local + Cloud</span>
          </button>
        </div>
      </div>
      <div id="folders" class="item-list"><div class="muted">Loading…</div></div>
      <button id="showFolderAdd" class="storage-add-card storage-add-folder" title="Add folder">
        <span class="storage-add-visual" aria-hidden="true">＋</span>
        <span class="storage-add-copy">Add folder</span>
      </button>
    </section>

    <section id="activityCard" class="background-work" hidden><div id="activity"></div></section>

    <section class="dashboard-section storage-backups-section">
      <h2 class="storage-visually-hidden">Backups</h2>
      <button id="refreshBackups" hidden aria-hidden="true">Refresh</button>
      <div id="backups" class="item-list"><div class="muted">Loading…</div></div>
      <button id="showBackupAdd" class="storage-add-card storage-add-backup" title="Add backup">
        <span class="storage-add-visual storage-add-drive" aria-hidden="true">＋</span>
        <span class="storage-add-copy">Add backup</span>
      </button>
      <div id="backupAdd" class="inline-add" hidden>
        <input id="backupLocation" placeholder="Backup folder">
        <button id="chooseBackup" class="secondary">Browse</button>
        <button id="addBackup" class="primary">Add</button>
      </div>
    </section>
  </main>

  <dialog id="connectionDialog" class="small-dialog">
    <div class="dialog-head"><h3>Cloud</h3><button class="icon" data-close>×</button></div>
    <div class="connect-fields">
      <input id="serverUrl" placeholder="Cloud URL">
      <input id="serverUsername" autocomplete="username" placeholder="Username" value="admin">
      <input id="serverPassword" type="password" autocomplete="current-password" placeholder="Password">
      <input id="serverToken" type="hidden">
    </div>
    <div class="dialog-actions"><div class="spacer"></div><button id="saveSettings" class="primary">Connect</button></div>
  </dialog>

  <dialog id="deviceDialog" class="small-dialog">
    <div class="dialog-head"><h3>Settings</h3><button class="icon" data-close>×</button></div>
    <div class="field-stack">
      <label class="field-label" for="deviceName">Device</label>
      <input id="deviceName" placeholder="Device">
      <label class="field-label" for="uploadWorkers">Upload concurrency</label>
      <select id="uploadWorkers">
        <option value="1">1 upload</option>
        <option value="2">2 uploads</option>
        <option value="4">4 uploads</option>
      </select>
    </div>
    <div class="dialog-actions"><div class="spacer"></div><button id="saveDevice" class="primary">Save</button></div>
  </dialog>

  <dialog id="backupDialog" class="small-dialog">
    <div class="dialog-head"><div><h3>Backup</h3><div id="backupPathLabel" class="picker-path"></div></div><button class="icon" data-close>×</button></div>
    <div class="field-stack">
      <input id="backupName" placeholder="Backup name">
      <label class="field-label" for="backupScope">Back up</label>
      <select id="backupScope"><option value="">Everything</option></select>
    </div>
    <div class="dialog-actions"><div class="spacer"></div><button data-close class="secondary">Cancel</button><button id="initializeBackup" class="primary">Save</button></div>
  </dialog>

  <dialog id="restoreDialog">
    <div class="dialog-head"><div><h3>Restore</h3><div id="restoreBackupLabel" class="picker-path"></div></div><button class="icon" data-close>×</button></div>
    <div id="restoreSummary" class="restore-summary">Loading…</div>
    <div id="restoreSources" class="restore-sources"></div>
    <div id="restoreFiles" class="restore-files"></div>
    <div class="dialog-actions"><div class="spacer"></div><button data-close class="secondary">Cancel</button><button id="startRestore" class="primary">Restore to Cloud</button></div>
  </dialog>

  <div id="toast" class="toast"></div>
  <script type="module" src="/app.js"></script>
  <script type="module" src="/protection.js"></script>
  <script type="module" src="/folder-modes.js"></script>
  <script type="module" src="/multi-folder-pick.js"></script>
  <script type="module" src="/client-shell.js"></script>
  <script type="module" src="/storage-polish.js"></script>
  <script>
    const homeBrand = document.querySelector('.client-header .app-brand');
    const homeFrame = document.querySelector('#filesFrame');
    const openAllFiles = () => homeFrame?.contentWindow?.mochimonoHome?.();
    homeBrand?.addEventListener('click', openAllFiles);
    homeBrand?.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.code === 'Space') openAllFiles();
    });
  </script>
</body>
</html>
