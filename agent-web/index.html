<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0d0c0e">
  <title>Mochimono</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/client-shell.css">
</head>
<body>
  <header class="client-header">
    <div class="app-brand"><span class="mini" aria-hidden="true"></span><h1>Mochimono</h1></div>
    <div class="client-head-actions">
      <nav class="client-tabs" aria-label="Mochimono">
        <button class="active" data-client-tab="files" title="Library" aria-label="Library">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.25" y="3.25" width="5.5" height="5.5" rx=".8"/><rect x="11.25" y="3.25" width="5.5" height="5.5" rx=".8"/><rect x="3.25" y="11.25" width="5.5" height="5.5" rx=".8"/><rect x="11.25" y="11.25" width="5.5" height="5.5" rx=".8"/></svg>
        </button>
        <button data-client-tab="storage" title="Storage" aria-label="Storage">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.25 5.25h13.5v9.5H3.25zM5.5 12.25h.01M8 12.25h.01"/></svg>
        </button>
      </nav>
      <div id="serverStorage" class="client-storage" hidden>
        <span id="serverStorageText"></span>
        <i><b id="serverStorageBar"></b></i>
      </div>
      <div class="agent-meta">
        <button id="deviceButton" class="device-button" title="Rename device"><span id="deviceLabel"></span></button>
        <span class="meta-separator">·</span>
        <button id="serverStatus" class="status">Connecting…</button>
      </div>
      <button id="clientLogout" class="client-logout" hidden>Log out</button>
    </div>
  </header>

  <main id="filesPane" class="files-pane">
    <iframe id="filesFrame" src="/files/" title="Mochimono Files"></iframe>
  </main>

  <main id="storagePane" class="dashboard" hidden>
    <section class="dashboard-section">
      <div class="section-head">
        <h2>Folders</h2>
        <button id="showFolderAdd" class="round-action" title="Add folder" aria-label="Add folder">＋</button>
      </div>
      <div id="folderAdd" class="inline-add" hidden>
        <input id="importPath" placeholder="Folder or drive">
        <button id="chooseImport" class="secondary">Browse</button>
        <button id="startImport" class="primary">Add</button>
      </div>
      <div id="folders" class="item-list"><div class="muted">Loading…</div></div>
    </section>

    <section id="activityCard" class="background-work" hidden><div id="activity"></div></section>

    <section class="dashboard-section">
      <div class="section-head">
        <h2>Backups</h2>
        <div class="section-actions">
          <button id="refreshBackups" class="round-action subtle" title="Refresh backups" aria-label="Refresh backups">↻</button>
          <button id="showBackupAdd" class="round-action" title="Add backup" aria-label="Add backup">＋</button>
        </div>
      </div>
      <div id="backupAdd" class="inline-add" hidden>
        <input id="backupLocation" placeholder="Backup folder">
        <button id="chooseBackup" class="secondary">Browse</button>
        <button id="addBackup" class="primary">Add</button>
      </div>
      <div id="backups" class="item-list"><div class="muted">Loading…</div></div>
    </section>
  </main>

  <dialog id="connectionDialog" class="small-dialog">
    <div class="dialog-head"><h3>Server</h3><button class="icon" data-close>×</button></div>
    <div class="connect-fields">
      <input id="serverUrl" placeholder="Server">
      <input id="serverUsername" autocomplete="username" placeholder="Username" value="admin">
      <input id="serverPassword" type="password" autocomplete="current-password" placeholder="Password">
      <input id="serverToken" type="hidden">
    </div>
    <div class="dialog-actions"><div class="spacer"></div><button id="saveSettings" class="primary">Connect</button></div>
  </dialog>

  <dialog id="deviceDialog" class="small-dialog">
    <div class="dialog-head"><h3>Device</h3><button class="icon" data-close>×</button></div>
    <input id="deviceName" placeholder="Device">
    <div class="dialog-actions"><div class="spacer"></div><button id="saveDevice" class="primary">Save</button></div>
  </dialog>

  <dialog id="backupDialog" class="small-dialog">
    <div class="dialog-head"><div><h3>Backup</h3><div id="backupPathLabel" class="picker-path"></div></div><button class="icon" data-close>×</button></div>
    <div class="field-stack">
      <input id="backupName" placeholder="Backup name">
      <label class="field-label" for="backupScope">Back up</label>
      <select id="backupScope"><option value="">Everything</option></select>
    </div>
    <div class="dialog-actions"><div class="spacer"></div><button data-close class="secondary">Cancel</button><button id="initializeBackup" class="primary">Save</button></div>
  </dialog>

  <dialog id="restoreDialog">
    <div class="dialog-head"><div><h3>Restore</h3><div id="restoreBackupLabel" class="picker-path"></div></div><button class="icon" data-close>×</button></div>
    <div class="path-row"><input id="restoreDestination" placeholder="Destination"><button id="chooseRestore" class="secondary">Browse</button></div>
    <div class="dialog-actions"><div class="spacer"></div><button data-close class="secondary">Cancel</button><button id="startRestore" class="primary">Restore</button></div>
  </dialog>

  <div id="toast" class="toast"></div>
  <script type="module" src="/app.js"></script>
  <script type="module" src="/client-shell.js"></script>
  <script type="module" src="/relative-time.js"></script>
</body>
</html>
