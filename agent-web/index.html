<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0d0c0e">
  <title>Mochimono Agent</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="app-brand">
      <span class="mini" aria-hidden="true"></span>
      <div><h1>Mochimono</h1><span class="agent-label">Agent</span></div>
    </div>
    <div id="serverStatus" class="status">Connecting…</div>
  </header>

  <main>
    <section class="card import-card">
      <div class="section-title"><h2>Import</h2></div>
      <label>Folder or drive</label>
      <div class="path-row">
        <input id="importPath" placeholder="C:\Users\you\Pictures">
        <button id="chooseImport" class="secondary">Browse…</button>
      </div>
      <label>Source <span>optional</span></label>
      <input id="sourceName" placeholder="Old laptop, Phone, Photos…">
      <button id="startImport" class="primary wide">Import</button>
    </section>

    <section class="card backup-card">
      <div class="section-title row">
        <h2>Backups</h2>
        <button id="refreshBackups" class="secondary small">Refresh</button>
      </div>
      <label>Folder</label>
      <div class="path-row">
        <input id="backupLocation" placeholder="C:\MochimonoBackup">
        <button id="chooseBackup" class="secondary">Browse…</button>
      </div>
      <button id="addBackup" class="primary wide">Add</button>
      <div id="backups" class="drives backup-list"><div class="muted">Loading…</div></div>
    </section>

    <section class="card activity-card">
      <div class="section-title"><h2>Activity</h2></div>
      <div id="activity" class="empty">Idle</div>
    </section>

    <section class="card settings-card">
      <details>
        <summary>Settings</summary>
        <div class="settings-body">
          <label>Server</label>
          <input id="serverUrl" placeholder="http://127.0.0.1:8642">
          <label>Token</label>
          <input id="serverToken" type="password" placeholder="Unchanged if blank">
          <button id="saveSettings" class="secondary">Save</button>
        </div>
      </details>
    </section>
  </main>

  <dialog id="backupDialog">
    <div class="dialog-head">
      <div><h3>Backup</h3><div id="backupPathLabel" class="picker-path"></div></div>
      <button class="icon" data-close>×</button>
    </div>
    <label>Name</label>
    <input id="backupName" placeholder="Backup">
    <label>Protect</label>
    <label class="check"><input id="backupEverything" type="checkbox" checked> Everything</label>
    <div id="backupTypes" class="type-grid disabled">
      <label class="check"><input type="checkbox" value="image"> Images</label>
      <label class="check"><input type="checkbox" value="video"> Video</label>
      <label class="check"><input type="checkbox" value="audio"> Audio</label>
      <label class="check"><input type="checkbox" value="text"> Text</label>
      <label class="check"><input type="checkbox" value="application"> Documents</label>
      <label class="check"><input type="checkbox" value="other"> Other</label>
    </div>
    <div class="dialog-actions">
      <div class="spacer"></div>
      <button data-close class="secondary">Cancel</button>
      <button id="initializeBackup" class="primary">Save</button>
    </div>
  </dialog>

  <dialog id="restoreDialog">
    <div class="dialog-head">
      <div><h3>Restore</h3><div id="restoreBackupLabel" class="picker-path"></div></div>
      <button class="icon" data-close>×</button>
    </div>
    <label>Destination</label>
    <div class="path-row">
      <input id="restoreDestination" placeholder="C:\MochimonoRecovered">
      <button id="chooseRestore" class="secondary">Browse…</button>
    </div>
    <div class="dialog-actions">
      <div class="spacer"></div>
      <button data-close class="secondary">Cancel</button>
      <button id="startRestore" class="primary">Restore</button>
    </div>
  </dialog>

  <div id="toast" class="toast"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
